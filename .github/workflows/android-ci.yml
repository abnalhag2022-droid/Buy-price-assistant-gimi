name: Android CI

on:
  push:
    branches: [main, update-v2, update-v3, development-v1.2.0, feature/excel-import-export-v1.3.0, feature/hji-professional-upgrade, claude-development]
  pull_request:
    branches: [main, update-v2, update-v3, development-v1.2.0, feature/excel-import-export-v1.3.0, feature/hji-professional-upgrade, claude-development]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: android-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify-and-build:
    name: Analyze, test, and build APK and AAB
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Check out source
        # Actions are pinned to full commit SHAs (tag in the comment) so a moved
        # tag cannot change what runs with the signing secrets.
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Install Flutter stable
        uses: flutter-actions/setup-flutter@adb607ae976a9e00473569facfc69813c637a060 # v4.3
        with:
          channel: stable
          version: 3.47.5
          cache: true
          cache-sdk: true

      - name: Install SQLite libraries for desktop database tests
        run: |
          sudo apt-get update
          sudo apt-get install -y libsqlite3-0 libsqlite3-dev

      - name: Show toolchain versions
        run: |
          flutter --version
          dart --version
          java -version

      - name: Resolve dependencies
        run: |
          if [ -f pubspec.lock ]; then
            flutter pub get --enforce-lockfile
          else
            flutter pub get
          fi

      - name: Parse Dart sources
        run: dart format --output=none lib test

      - name: Static analysis
        run: flutter analyze

      - name: Run unit and SQLite data tests
        run: flutter test --reporter expanded

      - name: Generate Android platform files
        run: python3 tool/prepare_android.py

      - name: Verify Android package and release version
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          gradle_candidates = [
              Path("android/app/build.gradle.kts"),
              Path("android/app/build.gradle"),
          ]
          gradle = next((p for p in gradle_candidates if p.is_file()), None)
          if gradle is None:
              raise SystemExit("Android app Gradle file was not generated.")
          source = gradle.read_text(encoding="utf-8")
          app_id = re.search(r'applicationId\s*(?:=\s*)?["\']([^"\']+)["\']', source)
          if not app_id:
              raise SystemExit("Could not determine Android applicationId.")
          version = Path("pubspec.yaml").read_text(encoding="utf-8")
          match = re.search(r"(?m)^version:\s*([^+\s]+)\+(\d+)\s*$", version)
          if not match:
              raise SystemExit("pubspec.yaml must define versionName+versionCode.")
          print(f"Android applicationId: {app_id.group(1)}")
          print(f"Flutter versionName: {match.group(1)}")
          print(f"Flutter versionCode: {match.group(2)}")
          PY


      # Only trusted push/manual runs receive secrets. Pull requests build without release secrets.
      - name: Prepare release keystore and key.properties
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_PASSWORD ANDROID_KEY_ALIAS; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Required repository secret $name is missing."
              exit 1
            fi
          done

          KEYSTORE_PATH="$RUNNER_TEMP/gimi-release.jks"
          export KEYSTORE_PATH
          python3 - <<'PY'
          import base64, os
          from pathlib import Path
          raw = base64.b64decode(os.environ["ANDROID_KEYSTORE_BASE64"], validate=True)
          if not raw:
              raise SystemExit("Decoded keystore is empty.")
          Path(os.environ["KEYSTORE_PATH"]).write_bytes(raw)
          PY

          # Escape Java Properties metacharacters and line endings safely.
          python3 - <<'PY'
          import os
          from pathlib import Path

          BS = chr(92)

          def esc(value):
              out = []
              for i, ch in enumerate(value):
                  if ch == BS:
                      out.append(BS + BS)
                  elif ch == "\t":
                      out.append(BS + "t")
                  elif ch == "\n":
                      out.append(BS + "n")
                  elif ch == "\r":
                      out.append(BS + "r")
                  elif ch in "=:#!":
                      out.append(BS + ch)
                  elif ch == " " and i == 0:
                      out.append(BS + ch)
                  else:
                      out.append(ch)
              return "".join(out)

          values = {
              "storePassword": os.environ["ANDROID_KEYSTORE_PASSWORD"],
              "keyPassword": os.environ["ANDROID_KEY_PASSWORD"],
              "keyAlias": os.environ["ANDROID_KEY_ALIAS"],
              "storeFile": os.environ["KEYSTORE_PATH"],
          }
          target = Path("android/key.properties")
          target.write_text(
              "".join(f"{key}={esc(value)}\n" for key, value in values.items()),
              encoding="utf-8",
          )
          PY

          # Validate the keystore/alias/password before starting the expensive build.
          keytool -list -keystore "$KEYSTORE_PATH" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD >/dev/null
          echo "Release keystore and alias validated."

      - name: Resolve final Android plugin metadata
        run: flutter pub get --enforce-lockfile

      - name: Build release-mode APK
        run: flutter build apk --release

      - name: Build release-mode Android App Bundle (for Google Play)
        run: flutter build appbundle --release

      - name: Verify build outputs exist
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          test -s build/app/outputs/bundle/release/app-release.aab

      - name: Check identity, version and SDK levels in the APK manifest
        run: |
          set -euo pipefail
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/aapt2" dump badging build/app/outputs/flutter-apk/app-release.apk > badging.txt
          grep -E "^(package|sdkVersion|minSdkVersion|targetSdkVersion|uses-permission|application-label:|application-icon-160|application:)" badging.txt
          python3 - <<'PY'
          import re
          from pathlib import Path
          badging = Path("badging.txt").read_text(encoding="utf-8")
          pubspec = Path("pubspec.yaml").read_text(encoding="utf-8")
          name, code = re.search(r"(?m)^version:\s*([^+\s]+)\+(\d+)\s*$", pubspec).groups()
          expected = {
              "package": "name='com.abnalhag.gimi.buy_price_assistant_gimi'",
              "versionCode": f"versionCode='{code}'",
              "versionName": f"versionName='{name}'",
              "targetSdkVersion": "targetSdkVersion:'36'",
          }
          missing = [key for key, text in expected.items() if text not in badging]
          # Older aapt2 prints sdkVersion:, newer prints minSdkVersion:.
          min_sdk = re.search(r"(?m)^(?:min)?[sS]dkVersion:'(\d+)'", badging)
          if not min_sdk or min_sdk.group(1) != "24":
              missing.append(f"minSdkVersion ({min_sdk.group(1) if min_sdk else 'not found'})")
          if missing:
              raise SystemExit(f"Unexpected manifest values: {missing}")
          storage = [p for p in ("READ_EXTERNAL_STORAGE", "WRITE_EXTERNAL_STORAGE", "MANAGE_EXTERNAL_STORAGE") if p in badging]
          if storage:
              raise SystemExit(f"Unexpected storage permissions: {storage}")
          print("Package, version, SDK levels and permissions are as expected.")
          PY

      - name: Check 16 KB page alignment of native libraries
        run: |
          set -euo pipefail
          APK=build/app/outputs/flutter-apk/app-release.apk
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          "$BUILD_TOOLS/zipalign" -c -P 16 -v 4 "$APK" | tail -n 3
          LIBS="$RUNNER_TEMP/apk-libs"
          rm -rf "$LIBS" && mkdir -p "$LIBS"
          unzip -q "$APK" 'lib/arm64-v8a/*.so' 'lib/x86_64/*.so' -d "$LIBS" || true
          status=0
          for so in $(find "$LIBS" -name '*.so'); do
            align="$(readelf -lW "$so" | awk '$1 == "LOAD" { print $NF }' | sort -u | head -n 1)"
            echo "$(basename "$so") LOAD alignment $align"
            if [ $(( align )) -lt $(( 0x4000 )) ]; then status=1; fi
          done
          exit $status

      - name: Verify APK and AAB signatures match release keystore
        if: github.event_name != 'pull_request'
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          APK="build/app/outputs/flutter-apk/app-release.apk"
          AAB="build/app/outputs/bundle/release/app-release.aab"
          KEYSTORE="$RUNNER_TEMP/gimi-release.jks"
          BUILD_TOOLS="$(find "$ANDROID_HOME/build-tools" -mindepth 1 -maxdepth 1 -type d | sort -V | tail -n 1)"
          APKSIGNER="$BUILD_TOOLS/apksigner"
          test -x "$APKSIGNER"

          KEY_SHA="$(keytool -list -v -keystore "$KEYSTORE" -alias "$ANDROID_KEY_ALIAS" \
            -storepass:env ANDROID_KEYSTORE_PASSWORD \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          APK_SHA="$("$APKSIGNER" verify --print-certs "$APK" \
            | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"
          # An AAB is signed with jarsigner (JAR signing), not APK Signature Scheme.
          jarsigner -verify "$AAB" | tail -n 1
          AAB_SHA="$(keytool -printcert -jarfile "$AAB" \
            | sed -n 's/^[[:space:]]*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:lower:]' '[:upper:]')"

          if [ -z "$KEY_SHA" ] || [ -z "$APK_SHA" ] || [ -z "$AAB_SHA" ]; then
            echo "::error::Could not read SHA-256 certificate fingerprint."
            exit 1
          fi
          if [ "$KEY_SHA" != "$APK_SHA" ]; then
            echo "::error::APK certificate does not match the configured release keystore."
            exit 1
          fi
          if [ "$KEY_SHA" != "$AAB_SHA" ]; then
            echo "::error::AAB certificate does not match the configured release keystore."
            exit 1
          fi
          "$APKSIGNER" verify --verbose "$APK"
          echo "APK and AAB are signed with the configured release key."

      - name: Remove temporary signing files
        if: always()
        run: |
          rm -f android/key.properties "$RUNNER_TEMP/gimi-release.jks"

      # Pull-request builds intentionally skip release signing. Do not publish their outputs as an installable update.
      - name: Upload signed release APK artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: buy-price-assistant-gimi-signed-release-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload signed Android App Bundle artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: buy-price-assistant-gimi-signed-release-aab-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          if-no-files-found: error
          retention-days: 14
